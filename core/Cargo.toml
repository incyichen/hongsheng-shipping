[package]
name = "shipping_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
